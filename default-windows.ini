# Example Windows mappings for Logi Options Open.
# This is an experimental third-party project, not official Logitech software.
# Copy this file to your writable configuration directory before editing.
# Control IDs are hexadecimal; thumb.left/right represent the horizontal wheel.
[global]
0052 = MouseMiddle
0053 = MouseBack
0056 = MouseForward
00C4 = WheelMode
00C3 = Win+Tab
00C3.left = Win+Ctrl+Left
00C3.right = Win+Ctrl+Right
00C3.up = Win
00C3.down = Win+D
thumb.left = VolumeDown
thumb.right = VolumeUp
thumb.speed = 100

[firefox.exe]
thumb.left = Ctrl+Shift+Tab
thumb.right = Ctrl+Tab

[chrome.exe]
thumb.left = Ctrl+Shift+Tab
thumb.right = Ctrl+Tab

[hotkeys]
# Uncomment only if desired:
# Ctrl+Alt+F9 = Ring

[ring]
Play / Pause = PlayPause
Media = Folder(Media)
Mute = Mute
Task View = Win+Tab
Show Desktop = Win+D
File Explorer = Win+E
Screenshot = Win+Shift+S

[ring/Media]
Previous Track = PreviousTrack
Next Track = NextTrack
Play / Pause = PlayPause
Mute = Mute
