name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 ninja-build libhidapi-dev libglib2.0-dev qt6-base-dev libgl1-mesa-dev libx11-dev libxtst-dev libwayland-dev libmutter-14-dev gobject-introspection libgirepository1.0-dev xvfb xauth openbox
          python3 -m pip install 'cmake>=4.1,<4.2'
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++-19 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        id: build
        run: cmake --build build --parallel 2
      - name: Real desktop and process behavior (simulated HID)
        run: xvfb-run -a -s '-screen 0 1280x900x24' sh tests/run-linux-desktop-tests.sh build
      - name: Real kernel uinput events (not physical mouse)
        if: always() && steps.build.outcome == 'success'
        run: |
          sudo modprobe uinput
          sudo ctest --test-dir build -R linux-uinput-kernel --output-on-failure -V --output-log build/test-evidence/kernel-input.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-behavior-evidence
          path: |
            build/Testing/Temporary/*.log
            build/test-evidence/
      - name: Package
        run: cd build && cpack
      - uses: actions/upload-artifact@v4
        with:
          name: logi-options-open-linux-x64
          path: build/logi-options-open-*.tar.gz
  wayland:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        desktop: [gnome, kde]
    steps:
      - uses: actions/checkout@v4
      - name: Native desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 ninja-build libhidapi-dev libglib2.0-dev qt6-base-dev qt6-wayland libgl1-mesa-dev libx11-dev libxtst-dev libwayland-dev libmutter-14-dev gobject-introspection libgirepository1.0-dev xvfb xauth dbus-x11 python3-gi acl
          if [ '${{ matrix.desktop }}' = gnome ]; then
            sudo apt-get install -y gnome-shell gjs
          else
            sudo apt-get install -y kwin-wayland kwin-wayland-backend-virtual plasma-workspace klipper libkf5globalaccel-bin qtwayland5
          fi
          python3 -m pip install 'cmake>=4.1,<4.2'
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++-19 -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Actual native Wayland behavior
        timeout-minutes: 8
        env:
          LOGI_TEST_ALLOW_DEVICE_ACL: '1'
        run: |
          sudo modprobe uinput
          sudo chmod 666 /dev/uinput
          mkdir -p build/test-evidence
          export LOGI_TEST_EVIDENCE="$(realpath build/test-evidence)"
          bash tests/run-${{ matrix.desktop }}-wayland.sh build/logi-linux-wayland-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wayland-${{ matrix.desktop }}-evidence
          path: build/test-evidence/
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-python
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Test without hardware
        run: |
          ctest --test-dir build --output-on-failure
          ./build/logi-cli.exe check-config ./default-windows.ini
          python -m py_compile bridge.py
      - name: Package
        run: cd build && cpack
      - uses: actions/upload-artifact@v4
        with:
          name: logi-options-open-windows-x64
          path: build/logi-options-open-*.zip
