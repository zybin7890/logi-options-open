# Experimental Linux mappings. Desktop shortcut meanings depend on your compositor.
# Super+Tab / Ctrl+Alt+arrows suit several desktops; customize for yours.
[global]
0052=MouseMiddle
0053=MouseBack
0056=MouseForward
00C4=WheelMode
00C3=Super+Tab
00C3.left=Ctrl+Alt+Left
00C3.right=Ctrl+Alt+Right
00C3.up=Super
00C3.down=Super+D
thumb.left=VolumeDown
thumb.right=VolumeUp
thumb.speed=100
